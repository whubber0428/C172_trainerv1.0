<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Checklist and Procedure Trainer</title>
<meta name="theme-color" content="#e9edf1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1217" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="C172 Trainer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Cessna 172S G1000 checklist and maneuver trainer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 -apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%;-webkit-touch-callout:none}
button,label,.tile,.listbtn{-webkit-user-select:none;user-select:none}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column instrument-panel app. Placard headers, checklist rows with dot leaders, annunciator-colored state. */
:root{
  --bg:#e9edf1; --panel:#ffffff; --panel-2:#f3f5f8; --ink:#141a22; --muted:#5a6573; --line:#d3d9e1;
  --amber:#b56a00; --amber-bg:#fff2dc; --green:#1d7a46; --green-bg:#e3f4ea; --red:#b3261e; --red-bg:#fde8e6;
  --placard:#141a22; --placard-ink:#f2f4f7; --focus:#2f6fd6; --sky1:#7fb4e6; --sky2:#d9e9f7; --hill:#9bb8a0; --hill2:#b8cdb9; --runway:#5b636c;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1217; --panel:#171c23; --panel-2:#1e242d; --ink:#e8ecf1; --muted:#8d98a6; --line:#2a313b;
  --amber:#ffb238; --amber-bg:#3a2a0e; --green:#4fd58a; --green-bg:#13301f; --red:#ff6b5e; --red-bg:#3a1714;
  --placard:#05070a; --placard-ink:#f2f4f7; --focus:#6aa2ff; --sky1:#13233a; --sky2:#3a5675; --hill:#1d2b25; --hill2:#26372f; --runway:#2a2f35; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1217; --panel:#171c23; --panel-2:#1e242d; --ink:#e8ecf1; --muted:#8d98a6; --line:#2a313b;
  --amber:#ffb238; --amber-bg:#3a2a0e; --green:#4fd58a; --green-bg:#13301f; --red:#ff6b5e; --red-bg:#3a1714;
  --placard:#05070a; --placard-ink:#f2f4f7; --focus:#6aa2ff; --sky1:#13233a; --sky2:#3a5675; --hill:#1d2b25; --hill2:#26372f; --runway:#2a2f35; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.tail{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.brand h1{font-size:30px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.placard{background:var(--placard);color:var(--placard-ink);font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:13px;padding:6px 12px;border-radius:4px;display:inline-block}
.placard.red{background:var(--red);color:#fff}
.section{display:grid;gap:8px;margin-top:22px}
.lists{display:grid;gap:8px}
.listbtn{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:60px}
.listbtn:active{background:var(--panel-2)}
.listbtn .name{font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:.01em}
.listbtn .meta{grid-column:1;font-size:13px;color:var(--muted)}
.listbtn .pct{grid-row:1/3;grid-column:2;font-family:var(--f-mono);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.gauge{width:44px;height:6px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--green)}
.mem{color:var(--red);font-weight:600}
.note{font-size:13px;color:var(--muted);margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
.speeds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.spd{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center}
.spd b{display:block;font-family:var(--f-mono);font-size:18px;font-weight:500}
.spd span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
@media (max-width:380px){.speeds{grid-template-columns:repeat(2,1fr)}}

/* list screen */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 10px;display:grid;gap:10px}
.hdr-row{display:flex;align-items:center;gap:10px}
.back{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:600;font-size:15px}
.hdr h2{font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;flex:1;min-width:0;line-height:1.1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:7px;padding:8px 4px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.banner{background:var(--red-bg);color:var(--red);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 14px}
.row:last-child{border-bottom:0}
.box{width:22px;height:22px;border:2px solid var(--muted);border-radius:4px;margin-top:2px;display:grid;place-items:center}
.row.done .box{background:var(--green);border-color:var(--green)}
.row.done .box::after{content:"";width:6px;height:11px;border:solid var(--panel);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.row.done .ch{color:var(--muted)}
.line{display:flex;align-items:baseline;gap:6px;min-width:0;flex-wrap:wrap}
.ch{font-weight:600}
.lead{flex:1;min-width:24px;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
.rs{font-family:var(--f-mono);font-size:14px;text-transform:uppercase;text-align:right}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:10px 16px;font-weight:600}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.good{background:var(--green-bg);color:var(--green);border-color:transparent}
.btn.bad{background:var(--red-bg);color:var(--red);border-color:transparent}
.grow{flex:1}

/* drill */
.prog{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.bar{height:4px;background:var(--panel-2);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--amber);transition:width .25s}
.drill{padding:20px 18px;display:grid;gap:14px}
.step{font-family:var(--f-mono);font-size:12px;color:var(--amber);letter-spacing:.08em}
.chal{font-family:var(--f-display);font-size:32px;font-weight:600;line-height:1.1}
.resp{min-height:64px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;padding:10px;text-align:center}
.resp.shown{border-style:solid;border-color:var(--amber);background:var(--amber-bg)}
.resp .rs{font-size:20px;text-align:center;color:var(--ink)}
.prev{font-size:13px;color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.opt .rs{font-size:13px;color:var(--muted);text-align:left}
.opt.right{background:var(--green-bg);border-color:var(--green)}
.opt.wrong{background:var(--red-bg);border-color:var(--red)}
.score{text-align:center;display:grid;gap:8px;padding:28px 18px}
.score b{font-family:var(--f-mono);font-size:44px;font-weight:500}
.missed{text-align:left;display:grid;gap:4px;font-size:14px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.toggle input{width:18px;height:18px;accent-color:var(--amber)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.cond,.cond-row{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--amber)}
.cond-row{background:var(--panel-2);padding:8px 14px;border-bottom:1px solid var(--line)}
.row.memrow{box-shadow:inset 3px 0 0 var(--red)}
.complete{display:flex;align-items:baseline;gap:6px;padding:12px 14px;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-top:1px solid var(--line)}
.complete .lead{min-width:12px}
.seg{grid-template-columns:repeat(4,1fr)}
.seg button{font-size:14px;white-space:nowrap;letter-spacing:.02em;padding-inline:2px}
.panelwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line);margin-top:12px;background:#1b1d20}
/* Fixed 1000:760 ratio so iOS Safari can't distort the panel. Portrait phones scroll a 900px-wide panel; landscape and wide screens fit to width. */
#panel{display:block;width:900px;max-width:none;height:auto;aspect-ratio:1000/760;touch-action:manipulation;user-select:none;-webkit-user-select:none}
@media (min-width:932px),(orientation:landscape){#panel{width:100%}}
.panelwrap{overscroll-behavior-x:contain}
@media (orientation:landscape){body.chair .wrap{max-width:none}}
#panel .ctl{cursor:pointer}
#panel .hit{fill:transparent}
#panel .pl{fill:#cfd5db;font-family:var(--f-body);font-weight:600;letter-spacing:.04em}
#panel .sw .pt,#panel .sw .pb{fill:#34383d}
#panel .sw.on .pt{fill:#e9edf1}
#panel .sw:not(.on) .pb{fill:#8e97a1}
#panel .sw .pt.red,#panel .sw .pb.red{fill:#4a1c1a}
#panel .sw.on .pt.red{fill:#e04b3f}
#panel .sw:not(.on) .pb.red{fill:#9b342c}
#panel .tg .up{display:none}
#panel .tg.on .up{display:inline}
#panel .tg.on .dn{display:none}
#panel .lamp{fill:#26302a}
#panel .sw.on .lamp{fill:#4fd58a}
#panel g[id$="Knob"],#panel #selPtr,#panel #keyPtr{transition:transform .35s ease}
.fx-good{fill:rgba(79,213,138,.18);stroke:#4fd58a;stroke-width:3}
.fx-bad{fill:rgba(255,107,94,.18);stroke:#ff6b5e;stroke-width:3}
.fx-hint{fill:rgba(255,178,56,.15);stroke:#ffb238;stroke-width:3;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.25}}
.pstatus{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-top:8px;min-height:1.4em}
.rot{font-size:13px;color:var(--muted);margin:4px 0 8px}
.chairc .chal{font-size:28px}
@media (prefers-reduced-motion:reduce){.fx-hint{animation:none}#panel g[id$="Knob"],#panel #selPtr,#panel #keyPtr{transition:none}}
.arr{display:grid;gap:10px;padding:18px}
.slots{display:grid;gap:6px}
.slot{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px}
.slot.empty{background:transparent;border-style:dashed;align-items:center}
.slot.right{background:var(--green-bg);border-color:var(--green)}
.slot.wrong{background:var(--red-bg);border-color:var(--red)}
.slot .num{font-family:var(--f-mono);font-size:13px;color:var(--muted);min-width:20px;padding-top:2px}
.slot .rs{font-size:13px}
.fix{font-size:13px;color:var(--red);margin-top:4px;font-weight:600}
.cond.sm{font-size:12px;letter-spacing:.03em}
.pool-h{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px;font-size:14px}

/* cover */
.cover{display:grid;gap:18px}
.hero{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2));border:1px solid var(--line)}
.hero svg{display:block;width:100%;height:auto}
.hero .tag{position:absolute;right:12px;bottom:10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--placard-ink);background:rgba(10,14,20,.55);padding:4px 8px;border-radius:4px}
.cover h1{font-family:var(--f-display);font-size:clamp(34px,9vw,52px);font-weight:700;line-height:.95;text-transform:uppercase;letter-spacing:.01em}
.cover .kicker{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--amber);text-transform:uppercase;margin-bottom:6px}
.cover .lede{color:var(--muted);margin:8px 0 0;max-width:46ch}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:grid;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:118px;align-content:start}
.tile:active{background:var(--panel-2)}
.tile .tname{font-family:var(--f-display);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.tile .tmeta{font-size:13px;color:var(--muted)}
.tile .tbar{height:5px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden;margin-top:auto}
.tile .tbar i{display:block;height:100%;background:var(--green)}
.tile .tpct{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tile.emer{border-color:var(--red)}
.tile.emer .tname{color:var(--red)}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px;color:var(--muted);text-align:center}
.modes div{background:var(--panel-2);border-radius:8px;padding:8px 4px}
.modes b{display:block;white-space:nowrap;font-family:var(--f-display);font-size:14px;color:var(--ink);text-transform:uppercase;letter-spacing:.03em}
@media (max-width:360px){.tiles{grid-template-columns:1fr}.modes{grid-template-columns:1fr 1fr}}
.tile.big{min-height:0;padding:16px;gap:8px}
.tile .ticon{color:var(--amber)}
.tiles.two{grid-template-columns:1fr 1fr}
.std{background:var(--amber-bg);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:grid;gap:4px;font-size:14px}
@media (max-width:480px){.tiles{grid-template-columns:1fr}}
.callout{display:inline-block;margin-top:4px;font-style:italic;font-size:13px;color:var(--ink);background:var(--panel-2);border-left:3px solid var(--amber);padding:2px 8px;border-radius:0 4px 4px 0}
.std b{font-weight:600}
.tile.wide{grid-column:1/-1}
.psum{display:flex;gap:18px;align-items:center;padding:16px;flex-wrap:wrap;margin-top:6px}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;min-width:200px}
.pstats div{display:grid;gap:2px}
.pstats b{font-family:var(--f-mono);font-weight:500;font-size:26px;font-variant-numeric:tabular-nums}
.pstats b.k{color:var(--green)}.pstats b.m{color:var(--red)}
.pstats span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend i.k,.bar3 i.k{background:var(--green)}.legend i.m,.bar3 i.m{background:var(--red)}.legend i.u{background:var(--panel-2);border:1px solid var(--line)}
.bar3{grid-column:1/-1;display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--panel-2);border:1px solid var(--line)}
.bar3 i{display:block;height:100%}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prog-card{padding:0}
.pgroup{border-bottom:1px solid var(--line)}
.pgroup:last-child{border-bottom:0}
.pgroup summary{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}
.pgroup summary::-webkit-details-marker{display:none}
.pgroup summary .gname{font-family:var(--f-display);font-weight:600;font-size:18px}
.pgroup summary .gname::before{content:"▸ ";color:var(--muted)}
.pgroup[open] summary .gname::before{content:"▾ "}
.prows{display:grid;padding:0 14px 10px}
.prow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;text-align:left;background:transparent;border:0;border-top:1px dashed var(--line);padding:8px 0}
.prow .pname{font-size:15px;min-width:0}
.rings{display:flex;gap:6px}
.cur-ok{color:var(--green)!important}.cur-warn{color:var(--amber)!important}.cur-bad{color:var(--red)!important}.cur-none{color:var(--muted)!important}
.placard.amber{background:var(--amber);color:var(--bg)}
.curnote{margin:8px 0 0;max-width:60ch}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>

// Source: CESSNA 172S G1000 Checklist, Revised March 2023 (PRINT ONLY - PEA).
// Item: [challenge, response, note?]. A string starting with "?" is a condition header for the items after it.
// mem: number of leading items that are immediate-action (dashed box) memory items.
const LISTS = [
 {id:"acceptance", group:"Normal", name:"Aircraft Acceptance", items:[
  ["NOTAMs","Check"],["Weather","Check"],["Navigation","Check"],["Weight & Balance","Check"],
  ["Performance Calculations","Check"],["Inspection Status","Check"],["Maintenance Status","Check"],
  ["Emergency & Safety Equipment","Check","If applicable"],["S.P.A.R.(R.)O.W.","Check"],
  ["Tachometer","Recorded"],["Hobbs Meter","Recorded"],
 ]},
 {id:"cabin", group:"Normal", name:"Preflight — Cabin", items:[
  ["Documents","Check"],["POH","Available"],["G1000 Cockpit Reference Guide","Available"],
  ["Control Wheel Lock","Remove"],["Magneto Switch","Off"],["Avionics Switch (Bus 1 and 2)","Off"],
  ["Circuit Breakers","Verify (In)"],["Master Switch","On"],["Flaps","Extend/30°"],
  ["Primary Flight Display (PFD)","Check/On"],["Hobbs/Tach Time","Record"],
  ["Exterior Lights","On/Check"],["Pitot Heat","On/Check"],["Exterior Lights","Off"],["Pitot Heat","Off"],
  ["Fuel Quantity (L and R)","Check"],
  ["Low Fuel L and Low Fuel R Annunciators","Check","Verify annunciators are NOT shown on PFD"],
  ["Oil Pressure Annunciator","Check","Verify annunciator is shown"],
  ["Low Vacuum Annunciator","Check PFD","Ensure annunciator is shown"],
  ["Avionics Switch (Bus 1)","On"],["Forward Avionics Fan","Check/On"],["Avionics Switch (Bus 1)","Off"],
  ["Avionics Switch (Bus 2)","On"],["Aft Avionics Fan","Check/On"],["Avionics Switch (Bus 2)","Off"],
  ["Low Volts Annunciator","Check PFD","Verify annunciator is shown"],
  ["Master Switch (ALT and BAT)","Off"],["Parking Brake","Release"],["Flight Controls","Free/Correct"],
  ["Fire Extinguisher","Check/Secured"],["Fuel Selector Valve","Check/Both"],["Fuel Shutoff Valve","On (In Fully)"],
  ["Elevator Trim","Check/Set Takeoff"],["Alternate Static Source","Check/Off (In Fully)"],
  ["Mixture Control","Idle Cut-Off"],["Throttle","Closed"],["Avionics Master Switch","Off"],
  ["Electrical Switches","Off"],["Beacon Light","On"],["Ignition Switch","Off"],["ELT Switch","Armed"],
  ["Right Fuel Tank Quantity","Check"],["Engine Oil Quantity","Check"],["Left Fuel Tank Quantity","Check"],
  ["Windows","Clean All"],["PFD/MFD","Clean"],

const WALK = new Set(["acceptance","empennage","rwing","fwdfuse","lwing"]);
const COLD = new Set(["acceptance","cabin","empennage","rwing","fwdfuse","lwing","beforestart","start"]);
function controlFor(l,it){
  if(WALK.has(l.id)) return null;
  if(l.id==="secure" && it.cond) { if(!/master|standby batt|^lights|control wheel/i.test(it.ch)) return null; }
  if(l.id==="cabin" && /tank quantity|oil quantity/i.test(it.ch)) return null;
  const c=it.ch.toLowerCase();
  for(const [re,ids] of RULES) if(re.test(c)) return ids;
  return null;
}

const SW_IDS=["alt","bat","stbybatt","fuelpump","bcn","land","taxi","nav","strobe","pitot","pwr12","av1","av2"];
let ps;
function panelReset(l){
  const cold=COLD.has(l.id);
  ps={alt:false,bat:false,stbybatt:false,fuelpump:false,bcn:!cold,land:false,taxi:false,nav:!cold,strobe:!cold,pitot:false,pwr12:false,av1:!cold,av2:!cold,
      thr:cold?1:.35,mix:cold?1:.15,flaps:0,sel:"both",shutoff:"in",key:cold?"off":"both",pbrake:cold?"set":"rel",lock:l.id==="cabin"||l.id==="acceptance"};
  if(!cold){ps.alt=ps.bat=true;ps.stbybatt=true}
  if(l.id==="beforestart"||l.id==="start") ps.lock=false;
  if(l.id==="secure"){Object.assign(ps,{alt:true,bat:true,stbybatt:true,av1:false,av2:false,thr:1,mix:1,key:"off",pbrake:"rel"})}
  if(l.id==="runup"||l.id==="beforetakeoff"||l.id==="afterlanding") {ps.pbrake=l.id==="afterlanding"?"rel":"set";ps.thr=.8}
}
function applyEffect(it,ids){
  const r=it.rs.toLowerCase();
  const on=/^(on|arm|test|check\/on|verify \(on\)|armed)/.test(r), off=/^off|checked off/.test(r);
  const setSw=(arr,v)=>arr.forEach(k=>{if(k in ps) ps[k]=v});
  const expand=id=>id==="master"?["alt","bat"]:id==="avionics"?["av1","av2"]:id==="swrow"?["fuelpump","bcn","land","taxi","nav","strobe","pitot","pwr12","av1","av2"]:[id];
  const swTargets=ids.flatMap(expand).filter(k=>SW_IDS.includes(k));
  if(swTargets.length&&(on||off)) setSw(swTargets,on);
  if(ids.includes("elt")) ps.elt=true;
  if(ids.includes("throttle")){
    let v=null; const rpm=r.match(/(\d{3,4}) rpm/);
    if(/^idle \(650/.test(r)) v=.8; else if(/full forward|^full$|½ to full/.test(r)) v=/½/.test(r)?.25:0;
    else if(/closed|close|^idle/.test(r)) v=1; else if(/open ¼/.test(r)) v=.9;
    else if(rpm) v=Math.min(1,Math.max(0,1-(+rpm[1]-600)/2100)); else if(/^set|establish/.test(r)) v=.4;
    if(v!==null) ps.thr=v;
  }
  if(ids.includes("mixture")){
    if(/cut-?off/.test(r)) ps.mix=1; else if(/^lean/.test(r)) ps.mix=.35; else if(/rich|full forward|enrichen/.test(r)) ps.mix=0;
  }
  if(ids.includes("flaps")){
    const n=r.match(/(\d+)°/); if(n) ps.flaps=Math.min(30,+n[1]); else if(/full/.test(r)) ps.flaps=30; else if(/retract|up/.test(r)) ps.flaps=0;
  }
  if(ids.includes("fuelsel")){ if(/both/.test(r)) ps.sel="both"; else if(/left/.test(r)) ps.sel="left"; else if(/right/.test(r)) ps.sel="right"; }
  if(ids.includes("shutoff")){ if(/off|out/.test(r)) ps.shutoff="out"; else if(/on|in/.test(r)) ps.shutoff="in"; }
  if(ids.includes("ignition")){
    if(/^off/.test(r)) ps.key="off";
    else if(/start|engage/.test(r)&&!/^both/.test(r)){ps.key="start";drawPanel();setTimeout(()=>{ps.key="both";drawPanel()},700);return}
    else if(/both/.test(r)) ps.key="both";
  }
  if(ids.includes("pbrake")){ if(/release/.test(r)) ps.pbrake="rel"; else if(/set/.test(r)) ps.pbrake="set"; }
  if(ids.includes("yoke")&&/lock/i.test(it.ch)){ if(/remove/.test(r)) ps.lock=false; else if(/install/.test(r)) ps.lock=true; }
  drawPanel();
}
function drawPanel(){
  const svg=document.getElementById("panel"); if(!svg) return;
  SW_IDS.forEach(k=>{const g=svg.querySelector(`[data-c="${k}"]`); if(g) g.classList.toggle("on",!!ps[k])});
  const q=id=>svg.querySelector("#"+id);
  q("thrKnob").setAttribute("transform",`translate(0 ${ps.thr*40})`);
  q("thrShaft").setAttribute("height",4+ps.thr*40);
  q("mixKnob").setAttribute("transform",`translate(0 ${ps.mix*40})`);
  q("mixShaft").setAttribute("height",4+ps.mix*40);
  q("flapKnob").setAttribute("transform",`translate(0 ${ps.flaps/30*54})`);
  q("selPtr").setAttribute("transform",`rotate(${ {left:-60,both:0,right:60}[ps.sel]} 500 712)`);
  q("shutKnob").setAttribute("transform",`translate(0 ${ps.shutoff==="out"?9:0})`);
  q("shutStem").style.opacity=ps.shutoff==="out"?1:0;
  q("keyPtr").setAttribute("transform",`rotate(${ {off:-60,r:-30,l:0,both:30,start:62}[ps.key]} 62 466)`);
  q("pbKnob").setAttribute("transform",`translate(0 ${ps.pbrake==="set"?10:0})`);
  q("lockPin").style.display=ps.lock?"":"none";
}

let chair=null, chairTimer=null;
function renderChair(l){
  const h=header(l)+`<div id="chairTop"></div>
   <div class="panelwrap" id="pwrap">${panelSVG()}</div>
   <div class="pstatus" id="pstatus">Tap any control to see its name.</div>
   <p class="rot">Turn your phone sideways for a bigger panel. Layout is simplified; confirm control locations in your airplane.</p>
   ${l.mem&&l.mem<l.items.length?`<label class="toggle"><input type="checkbox" id="memonly" ${state.memOnly?"checked":""}> Memory items only</label>`:""}
   <div class="actions"><button class="btn" id="preset">Reset panel</button></div>`;
  $("#app").innerHTML=h;
  $("#back").onclick=()=>{clearTimeout(chairTimer);state.view="group";render();window.scrollTo(0,0)};
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{clearTimeout(chairTimer);state.mode=b.dataset.m;store.set("mode",state.mode);startMode();render()});
  const mo=document.getElementById("memonly"); if(mo) mo.onchange=()=>{state.memOnly=mo.checked;startChair(l)};
  $("#preset").onclick=()=>{panelReset(l);drawPanel()};
  $("#panel").addEventListener("click",e=>panelTap(l,e));
  startChair(l);
}
function startChair(l){
  clearTimeout(chairTimer);
  startMode(); panelReset(l); drawPanel();
  chair={tries:0,done:false,scored:0,total:0};
  updateChair(l);
}
function curItem(l){return drill.pos<drill.order.length?l.items[drill.order[drill.pos]]:null}
function updateChair(l){
  const top=$("#chairTop"); const it=curItem(l);
  clearFx();
  if(!it){
    top.innerHTML=`<div class="card score"><div class="step">CHECKLIST COMPLETE</div><b>${chair.scored}/${chair.total}</b>
      <div class="sub">Controls found on the first touch</div>
      ${drill.missed.length?`<div class="missed">${drill.missed.map(i=>lineHTML(l.items[i])).join("")}</div>`:""}
      <div class="actions"><button class="btn primary grow" id="again">Fly it again</button></div></div>`;
    $("#again").onclick=()=>startChair(l); return;
  }
  const i=drill.order[drill.pos], ctl=controlFor(l,it);
  top.innerHTML=progress()+`<div class="card drill chairc">
    <div class="step">${ctl?"TOUCH THE CONTROL":"VERIFY OR SAY IT"}${isMem(l,i)?' · <span class="mem">MEMORY ITEM</span>':""}</div>
    ${condHTML(it.cond)}
    <div class="chal">${esc(it.ch)}</div>
    <div class="resp ${chair.done||!ctl?"shown":""}" id="cresp">${chair.done||!ctl?`<div><div class="rs">${esc(it.rs)}</div>${noteHTML(it.note)}</div>`:`<span class="sub">Find it on the panel below</span>`}</div>
    <div class="actions">${ctl
      ?`<button class="btn grow" id="hint">Show me</button><button class="btn grow" id="skip">Skip</button>`
      :`<button class="btn primary grow" id="done">Done</button>`}</div></div>`;
  const on=(id,f)=>{const e=document.getElementById(id); if(e) e.onclick=f};
  on("done",()=>advance(l));
  on("skip",()=>{if(!drill.missed.includes(i))drill.missed.push(i);chair.total++;advance(l)});
  on("hint",()=>{chair.tries=Math.max(chair.tries,1);showTarget(ctl,"fx-hint",true)});
}
function advance(l){clearTimeout(chairTimer);drill.pos++;chair.tries=0;chair.done=false;updateChair(l)}
function chainIds(el){const ids=[];while(el&&el.id!=="panel"){if(el.dataset&&el.dataset.c)ids.push(el.dataset.c);el=el.parentNode}return ids}
function panelTap(l,e){
  const g=e.target.closest("[data-c]"); if(!g) return;
  const ids=chainIds(g);
  $("#pstatus").textContent=NAMES[ids[0]]||ids[0];
  const it=curItem(l); if(!it||chair.done) return;
  const ctl=controlFor(l,it); if(!ctl) return;
  const hit=ids.find(x=>ctl.includes(x));
  const i=drill.order[drill.pos];
  if(hit){
    chair.done=true; chair.total++;
    const first=chair.tries===0; if(first) chair.scored++;
    mark(l,i,first);
    clearFx(); flash(g,"fx-good"); applyEffect(it,[hit,...ctl]);
    updateChair(l);
    chairTimer=setTimeout(()=>advance(l),1100);
  } else {
    chair.tries++; flash(g,"fx-bad");
    if(chair.tries>=2) showTarget(ctl,"fx-hint",true);
  }
}
function clearFx(){const fx=document.getElementById("fx"); if(fx) fx.innerHTML=""}
function box(el,cls){
  const hitEl=el.querySelector(":scope > .hit")||el; const b=hitEl.getBBox();
  const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
  r.setAttribute("x",b.x-3);r.setAttribute("y",b.y-3);r.setAttribute("width",b.width+6);r.setAttribute("height",b.height+6);
  r.setAttribute("rx",6);r.setAttribute("class",cls);document.getElementById("fx").appendChild(r);return b;
}
function flash(el,cls){const fx=document.getElementById("fx");[...fx.querySelectorAll(".fx-bad")].forEach(n=>n.remove());box(el,cls);if(cls==="fx-bad")setTimeout(()=>{[...fx.querySelectorAll(".fx-bad")].forEach(n=>n.remove())},700)}
function showTarget(ctl,cls,scroll){
  const svg=$("#panel"); let first=null;
  [...svg.querySelectorAll(".fx-hint")].forEach(n=>n.remove());
  ctl.forEach(id=>{const el=svg.querySelector(`[data-c="${id}"]`); if(el){const b=box(el,cls); if(!first) first=b}});
  if(scroll&&first){const w=$("#pwrap"); const s=svg.clientWidth/1000; w.scrollTo({left:Math.max(0,(first.x+first.width/2)*s-w.clientWidth/2),behavior:"smooth"})}
}


const SECTIONS = {
  checklists:{name:"Checklists", groups:["Normal","Emergency","Abnormal","Reference"], info:"Every item from your 172S G1000 checklist: normal flows, memory items, abnormals, V-speeds."},
  maneuvers:{name:"Maneuvers", groups:["Takeoffs & Landings","Slow Flight & Stalls","Performance & Instrument","Ground Reference","Commercial"], info:"Every private and commercial maneuver from your 172S Maneuver Guide, with callouts and standards."}};
const GROUPS = SECTIONS.checklists.groups;
const sectionOf = g => SECTIONS.maneuvers.groups.includes(g)?"maneuvers":"checklists";
const store = {
  get(k,d){try{const v=localStorage.getItem("c172g:"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("c172g:"+k,JSON.stringify(v))}catch(e){}}
};
let mastery = store.get("mastery",{});
// Currency: each correctly answered item starts at 100% and loses 2 percentage points per full day since it was last answered correctly.
const DECAY_PER_DAY=2, DAY_MS=86400000;
let lastOk = store.get("lastOk",{});
(()=>{let ch=false;const now=Date.now();for(const k in mastery){if(mastery[k]===1&&!lastOk[k]){lastOk[k]=now;ch=true}}if(ch)store.set("lastOk",lastOk)})();
function itemCurrency(key,now=Date.now()){ if(mastery[key]!==1||!lastOk[key]) return 0; const days=Math.floor((now-lastOk[key])/DAY_MS); return Math.max(0,100-DECAY_PER_DAY*days); }
function record(key,ok){ mastery[key]=ok?1:0; if(ok) lastOk[key]=Date.now(); }
function saveResults(){ store.set("mastery",mastery); store.set("lastOk",lastOk); }
let checked = store.get("checked",{});
let state = {view:"cover", section:null, list:null, mode:(m=>["study","arrange","order","chair"].includes(m)?m:"study")(store.get("mode","study")), memOnly:false};
let drill = null;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const listById = id => LISTS.find(l=>l.id===id);
const isMem = (l,i) => l.mem && i < l.mem;
function pct(l){let k=0;l.items.forEach((_,i)=>{if(mastery[l.id+":"+i]===1)k++});return Math.round(100*k/l.items.length)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function lineHTML(it){return `<div class="line"><span class="ch">${esc(it.ch)}</span><span class="lead"></span><span class="rs">${esc(it.rs)}</span></div>`}
function noteHTML(n){ if(!n) return ""; const m=n.split(/\s*Callout:\s*/); let h="";
  if(m[0]) h+=`<div class="sub">${esc(m[0])}</div>`; if(m[1]) h+=`<div class="callout">${esc(m[1])}</div>`; return h; }
const condHTML = c => c ? `<div class="cond">${esc(c)}</div>` : "";


function sectionStats(sec){let k=0,t=0,n=0;LISTS.filter(l=>sectionOf(l.group)===sec).forEach(l=>{n++;l.items.forEach((_,i)=>{t++;if(mastery[l.id+":"+i]===1)k++})});return {n,p:t?Math.round(100*k/t):0}}
function statsFor(lists){const now=Date.now();let k=0,m=0,t=0,c=0,old=0;lists.forEach(l=>l.items.forEach((_,i)=>{t++;const key=l.id+":"+i,v=mastery[key];if(v===1){k++;const ic=itemCurrency(key,now);c+=ic;if(ic<100)old++;}else if(v===0)m++;}));
  return {k,m,t,u:t-k-m,p:t?Math.round(100*k/t):0,cur:t?Math.round(c/t):0,old}}

function curClass(st){ if(!st.k) return "cur-none"; const r=st.cur*st.t/st.k; return r>=80?"cur-ok":r>=50?"cur-warn":"cur-bad"; }

const ICON_CL=`<svg viewBox="0 0 32 32" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="5" width="18" height="24" rx="2"/><path d="M12 3h8v4h-8z"/><path d="M11 14l2 2 3-4M18 14h4M11 22l2 2 3-4M18 22h4"/></svg>`;
const ICON_MAN=`<svg viewBox="0 0 32 32" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22c4-10 10-14 16-12s6 8 0 10-10-2-8-6"/><path d="M24 6l4 2-3 3"/></svg>`;
function openList(id){state.view="list";state.list=id;state.section=sectionOf(listById(id).group);state.memOnly=false;startMode();render();window.scrollTo(0,0)}
function startMode(){
  const l=listById(state.list);
  let order=l.items.map((_,i)=>i);
  if(state.memOnly&&l.mem) order=order.slice(0,l.mem);
  drill={order,pos:0,missed:[],answered:null,opts:null};
  // Arrange: split into parts of ~10 so long lists fit on a phone
  const n=order.length, parts=n<=12?1:Math.ceil(n/10), size=Math.ceil(n/parts);
  const chunks=[]; for(let k=0;k<n;k+=size) chunks.push(order.slice(k,k+size));
  arr={chunks,ci:0,score:0,total:0}; arrStart();
}

function header(l){
  const m=state.mode;
  let banner="";
  if(l.mem) banner=`<div class="banner">${l.mem===l.items.length?"Every item here is a memory item.":`The first ${l.mem} items are memory items (dashed box).`}</div>`;
  return `<div class="hdr"><div class="hdr-row"><button class="back" id="back" aria-label="Back to checklists">‹ Back</button><h2>${esc(l.name)}</h2></div>
  <div class="seg" role="group" aria-label="Mode">
    <button data-m="study" aria-pressed="${m==="study"}">Checklist</button>
    <button data-m="arrange" aria-pressed="${m==="arrange"}">Arrange</button>
    <button data-m="order" aria-pressed="${m==="order"}">Sequence</button>
    <button data-m="chair" aria-pressed="${m==="chair"}">Chair Fly</button>
  </div>${banner}</div>`;
}

function renderList(){
  const l=listById(state.list);
  if(state.mode==="chair") return renderChair(l);
  let h=header(l);
  if(state.mode==="study") h+=studyHTML(l);
  else if(state.mode==="arrange") h+=arrangeHTML(l);
  else if(drill.pos>=drill.order.length) h+=doneHTML(l);
  else h+=orderHTML(l);
  if(state.mode!=="study"&&l.mem&&l.mem<l.items.length)
    h+=`<label class="toggle" style="margin-top:10px"><input type="checkbox" id="memonly" ${state.memOnly?"checked":""}> Memory items only</label>`;
  $("#app").innerHTML=h;
  $("#back").onclick=()=>{state.view="group";render();window.scrollTo(0,0)};
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{state.mode=b.dataset.m;store.set("mode",state.mode);startMode();render()});
  bind(l);
}

function studyHTML(l){
  const c=checked[l.id]||[];
  const n=c.filter(Boolean).length;
  let rows="", lastCond=null, inMem=false;
  l.items.forEach((it,i)=>{
    if(it.cond!==lastCond){ if(it.cond) rows+=`<div class="cond-row">${esc(it.cond)}</div>`; lastCond=it.cond; }
    rows+=`<button class="row ${c[i]?"done":""} ${isMem(l,i)?"memrow":""}" data-i="${i}"><span class="box"></span><span style="min-width:0">${lineHTML(it)}${noteHTML(it.note)}</span></button>`;
  });
  return `<div class="prog"><span>${n} / ${l.items.length} checked</span><span>Tap an item to check it</span></div><div class="bar" style="margin-bottom:12px"><i style="width:${100*n/l.items.length}%"></i></div>
  ${l.std?`<div class="std"><span class="step">STANDARDS</span>${l.std.map(([k,v])=>`<div><b>${esc(k)}:</b> ${esc(v)}</div>`).join("")}</div>`:""}<div class="card">${rows}<div class="complete">${esc(l.name)}${l.man?"":" checklist"} <span class="lead"></span> COMPLETE</div></div>
  <div class="actions"><button class="btn" id="clr">Clear checks</button><span class="grow"></span><button class="btn primary" id="go">Practice the order</button></div>`;
}

function progress(){
  const p=drill.pos, t=drill.order.length;
  return `<div class="prog"><span>Item ${p+1} of ${t}</span><span>${drill.missed.length} missed</span></div><div class="bar" style="margin-bottom:12px"><i style="width:${100*p/t}%"></i></div>`;
}

let arr=null;
function arrStart(){ const c=arr.chunks[arr.ci]; arr.placed=[]; arr.pool=shuffle(c); while(c.length>1&&arr.pool.every((x,k)=>x===c[k])) arr.pool=shuffle(c); arr.checked=false; }
const ikey=it=>(it.ch+"|"+it.rs).toLowerCase();
function arrangeHTML(l){
  if(arr.ci>=arr.chunks.length){
    return `<div class="card score"><div class="step">CHECKLIST COMPLETE</div><b>${arr.score}/${arr.total}</b>
    <div class="sub">Items placed in the right position</div>
    <div class="actions"><button class="btn grow" id="study">View checklist</button><button class="btn primary grow" id="arrAgain">Arrange again</button></div></div>`;
  }
  const chunk=arr.chunks[arr.ci], first=chunk[0], prevIdx=arr.ci>0?arr.chunks[arr.ci-1].slice(-1)[0]:null;
  const parts=arr.chunks.length;
  let right=0;
  const slots=chunk.map((exp,k)=>{
    const p=arr.placed[k];
    if(p===undefined) return `<div class="slot empty"><span class="num">${k+1}</span><span class="sub">${k===arr.placed.length?"Tap the next item below":""}</span></div>`;
    const it=l.items[p];
    let cls="", fix="";
    if(arr.checked){ const ok=ikey(it)===ikey(l.items[exp]); if(ok) right++; cls=ok?"right":"wrong";
      if(!ok) fix=`<div class="fix">Should be: ${esc(l.items[exp].ch)} — ${esc(l.items[exp].rs)}</div>`; }
    return `<button class="slot ${cls}" data-k="${k}" ${arr.checked?"disabled":""}><span class="num">${k+1}</span><span style="min-width:0;flex:1">${it.cond?`<div class="cond sm">${esc(it.cond)}</div>`:""}${lineHTML(it)}${fix}</span></button>`;
  }).join("");
  const pool=arr.pool.map(i=>{const it=l.items[i];return `<button class="opt chip" data-i="${i}">${it.cond?`<div class="cond sm">${esc(it.cond)}</div>`:""}<div class="ch">${esc(it.ch)}</div><div class="rs">${esc(it.rs)}</div></button>`}).join("");
  const done=arr.placed.length===chunk.length;
  return `<div class="prog"><span>${parts>1?`Part ${arr.ci+1} of ${parts} · items ${drill.order.indexOf(first)+1}–${drill.order.indexOf(first)+chunk.length}`:`${chunk.length} items`}</span><span>${arr.total?`${arr.score}/${arr.total} so far`:""}</span></div>
  <div class="bar" style="margin-bottom:12px"><i style="width:${100*arr.ci/parts}%"></i></div>
  <div class="card arr">
    <div class="step">${arr.checked?`${right} OF ${chunk.length} IN THE RIGHT PLACE`:"PUT THESE IN ORDER"}</div>
    <div class="prev">${prevIdx!==null?`Comes after: ${esc(l.items[prevIdx].ch)} — ${esc(l.items[prevIdx].rs)}`:"Start of checklist"}</div>
    <div class="slots">${slots}</div>
    ${!arr.checked&&arr.placed.length?`<div class="sub">Tap a placed item to send it back.</div>`:""}
    <div class="actions">${arr.checked
      ?`<button class="btn grow" id="arrRetry">Try this part again</button><button class="btn primary grow" id="arrNext">${arr.ci+1<parts?"Next part":"Finish"}</button>`
      :done?`<button class="btn grow" id="arrClear">Start over</button><button class="btn primary grow" id="arrCheck">Check order</button>`
      :arr.placed.length?`<button class="btn" id="arrUndo">Undo</button>`:""}</div>
  </div>
  ${arr.pool.length?`<div class="pool-h">Items to place · ${arr.pool.length} left</div><div class="opts">${pool}</div>`:""}`;
}
function bindArrange(l){
  const on=(id,f)=>{const e=document.getElementById(id); if(e) e.onclick=f};
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const i=+b.dataset.i; arr.pool.splice(arr.pool.indexOf(i),1); arr.placed.push(i); renderList()});
  document.querySelectorAll(".slot[data-k]").forEach(b=>b.onclick=()=>{ if(arr.checked) return; const k=+b.dataset.k; const [i]=arr.placed.splice(k,1); arr.pool.push(i); renderList()});
  on("arrUndo",()=>{arr.pool.push(arr.placed.pop());renderList()});
  on("arrClear",()=>{arrStart();renderList()});
  on("arrCheck",()=>{
    arr.checked=true; const c=arr.chunks[arr.ci];
    c.forEach((exp,k)=>{const ok=ikey(l.items[arr.placed[k]])===ikey(l.items[exp]); record(l.id+":"+exp,ok); if(ok)arr.score++; arr.total++;});
    saveResults(); renderList();
  });
  on("arrRetry",()=>{ const c=arr.chunks[arr.ci]; c.forEach((exp,k)=>{ if(ikey(l.items[arr.placed[k]])===ikey(l.items[exp])) arr.score--; arr.total--; }); arrStart(); renderList()});
  on("arrNext",()=>{arr.ci++; if(arr.ci<arr.chunks.length) arrStart(); renderList(); window.scrollTo(0,0)});
  on("arrAgain",()=>{startMode();renderList()});
}

function makeOpts(l){
  const i=drill.order[drill.pos], key=s=>(s.ch+"|"+s.rs).toLowerCase();
  const pool=[]; const seen=new Set([key(l.items[i])]);
  const add=it=>{if(!seen.has(key(it))){seen.add(key(it));pool.push(it)}};
  shuffle(l.items.slice(i+1)).forEach(add);
  shuffle(l.items.slice(0,i)).forEach(add);
  shuffle(LISTS.filter(x=>x.group===l.group&&x.id!==l.id).flatMap(x=>x.items)).forEach(add);
  return shuffle([{it:l.items[i],ok:true},...pool.slice(0,3).map(it=>({it,ok:false}))]);
}

function orderHTML(l){
  if(!drill.opts) drill.opts=makeOpts(l);
  const i=drill.order[drill.pos];
  const done=drill.order.slice(0,drill.pos).map(k=>l.items[k]).slice(-2);
  return progress()+`<div class="card drill">
    <div class="step">WHAT COMES NEXT?${isMem(l,i)?' · <span class="mem">MEMORY ITEM</span>':""}</div>
    ${drill.pos===0?`<div class="prev">Start of checklist</div>`:done.map(it=>`<div class="prev">✓ ${esc(it.ch)} — ${esc(it.rs)}</div>`).join("")}
    ${condHTML(l.items[i].cond)}
    <div class="opts">${drill.opts.map((o,k)=>{
      let cls=""; if(drill.answered!==null){ if(o.ok) cls="right"; else if(k===drill.answered) cls="wrong"; }
      return `<button class="opt ${cls}" data-k="${k}" ${drill.answered!==null?"disabled":""}><div class="ch">${esc(o.it.ch)}</div><div class="rs">${esc(o.it.rs)}</div></button>`}).join("")}</div>
    ${drill.answered!==null?`<div class="actions"><button class="btn primary grow" id="next">Next item</button></div>`:""}
  </div>`;
}

function doneHTML(l){
  const t=drill.order.length, ok=t-drill.missed.length;
  return `<div class="card score"><div class="step">CHECKLIST COMPLETE</div><b>${ok}/${t}</b>
  <div class="sub">${ok===t?"Clean run. Run it again tomorrow to keep it fresh.":"Review the items you missed, then run it again."}</div>
  ${drill.missed.length?`<div class="missed">${drill.missed.map(i=>lineHTML(l.items[i])).join("")}</div>`:""}
  <div class="actions"><button class="btn grow" id="study">View checklist</button><button class="btn primary grow" id="again">Run again</button></div></div>`;
}

function mark(l,i,ok){
  record(l.id+":"+i,ok); saveResults();
  if(!ok&&!drill.missed.includes(i)) drill.missed.push(i);
}

function bind(l){
  document.querySelectorAll(".row").forEach(r=>r.onclick=()=>{
    const c=checked[l.id]||(checked[l.id]=[]); const i=+r.dataset.i; c[i]=!c[i]; store.set("checked",checked); renderList();
  });
  const on=(id,f)=>{const e=document.getElementById(id); if(e) e.onclick=f};
  on("clr",()=>{checked[l.id]=[];store.set("checked",checked);renderList()});
  on("go",()=>{state.mode="arrange";store.set("mode","arrange");startMode();renderList()});
  on("next",()=>{drill.pos++;drill.answered=null;drill.opts=null;renderList()});
  on("again",()=>{startMode();renderList()});
  on("study",()=>{state.mode="study";store.set("mode","study");renderList()});
  if(state.mode==="arrange") bindArrange(l);
  const mo=document.getElementById("memonly"); if(mo) mo.onchange=()=>{state.memOnly=mo.checked;startMode();renderList()};
  document.querySelectorAll(".opt:not(.chip)").forEach(b=>b.onclick=()=>{
    if(drill.answered!==null) return; const k=+b.dataset.k; drill.answered=k;
    mark(l,drill.order[drill.pos],drill.opts[k].ok); renderList();
  });
}

function render(){ document.body.classList.toggle("chair", state.view==="list"&&state.mode==="chair"); state.view==="cover"?renderCover():state.view==="progress"?renderProgress():state.view==="group"?renderHome():renderList() }
render();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
